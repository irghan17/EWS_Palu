<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EWS SULTENG — Prototipe Akademik</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef4fb;--card:#fff;--ink:#0f1f3a;--mut:#5b6a82;--line:#dbe4f0;--blue:#1d5fd1;--blue-s:#e8f0fd;--red:#d92d20;--red-s:#fdecea;--org:#d97400;--org-s:#fff1de;--grn:#178a4c;--grn-s:#e3f5ea;--pur:#6b3fc0;--pur-s:#efe9fb;--teal:#0e7f89;--teal-s:#dff4f5;--navy:#0b1f45;--shadow:0 1px 2px rgba(15,31,58,.06),0 4px 14px rgba(15,31,58,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1424;--card:#131f34;--ink:#e6edf7;--mut:#93a3bd;--line:#243450;--blue:#5b94f0;--blue-s:#182a4c;--red:#ff6b5e;--red-s:#3a1a1a;--org:#ffa53a;--org-s:#3a2a12;--grn:#3fc67e;--grn-s:#12301f;--pur:#a98bf0;--pur-s:#261d45;--teal:#45c4cf;--teal-s:#12303a;--shadow:0 1px 2px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#0b1424;--card:#131f34;--ink:#e6edf7;--mut:#93a3bd;--line:#243450;--blue:#5b94f0;--blue-s:#182a4c;--red:#ff6b5e;--red-s:#3a1a1a;--org:#ffa53a;--org-s:#3a2a12;--grn:#3fc67e;--grn-s:#12301f;--pur:#a98bf0;--pur-s:#261d45;--teal:#45c4cf;--teal-s:#12303a;--shadow:0 1px 2px rgba(0,0,0,.3)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
a{color:var(--blue)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ic{flex:none;vertical-align:middle}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--navy);color:#cfdcf5;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;color:#fff;font-weight:700;letter-spacing:.02em}
.brand small{display:block;font-weight:400;font-size:11px;color:#9fb3d9;letter-spacing:0}
.nav a{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:10px;color:#cfdcf5;text-decoration:none;font-weight:500;cursor:pointer;margin-bottom:2px}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:#1d5fd1;color:#fff}
.nav hr{border:0;border-top:1px solid rgba(255,255,255,.12);margin:10px 6px}
.sysbox{margin-top:auto;border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:12px;font-size:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#34d27b;margin-right:6px}
.main{padding:0 22px 28px;min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:16px 0;flex-wrap:wrap}
.top h1{margin:0;font-size:26px;letter-spacing:-.01em}
.top .sub{font-size:13px;color:var(--mut);max-width:520px}
.logo{width:46px;height:46px;border-radius:12px;background:#f5a300;color:#fff;display:grid;place-items:center}
.sp{flex:1}
.search{position:relative}
.search input{width:260px;max-width:100%;padding:9px 12px 9px 36px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.search .ic{position:absolute;left:12px;top:10px;color:var(--mut)}
.sres{position:absolute;top:42px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:40;overflow:hidden}
.sres button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px}
.sres button:hover{background:var(--blue-s)}
.ibtn{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.cnt{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;border-radius:999px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.btn{display:inline-flex;gap:6px;align-items:center;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn:hover{filter:brightness(.96)}
.modechip{border-radius:999px;padding:7px 12px;font-weight:700;font-size:12px;border:1px solid var(--line);background:var(--card)}
.modechip.rp{background:var(--pur-s);color:var(--pur);border-color:transparent}
.modechip.lv{background:var(--grn-s);color:var(--grn);border-color:transparent}
.prof{display:flex;gap:8px;align-items:center;font-size:12px}
.av{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.ch{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ch h3{margin:0;font-size:15px;display:flex;gap:8px;align-items:center}
.pad{padding:14px 16px}
h2.pt{margin:6px 0 4px;font-size:22px}
.lead{color:var(--mut);margin:0 0 14px}
.bd{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.03em;padding:2px 6px;border-radius:5px;white-space:nowrap;vertical-align:middle}
.bd.off{background:var(--grn-s);color:var(--grn)}.bd.rt{background:var(--blue-s);color:var(--blue)}.bd.sim{background:var(--org-s);color:var(--org)}.bd.rec{background:var(--pur-s);color:var(--pur)}.bd.doc{background:var(--teal-s);color:var(--teal)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.lv-red{background:var(--red-s);color:var(--red)}.lv-org{background:var(--org-s);color:var(--org)}.lv-grn{background:var(--grn-s);color:var(--grn)}.lv-blu{background:var(--blue-s);color:var(--blue)}.lv-gry{background:var(--line);color:var(--mut)}
.banner{display:flex;gap:16px;align-items:center;padding:14px 18px;border-radius:14px;border:1px solid;margin-bottom:14px;flex-wrap:wrap}
.banner.red{background:var(--red-s);border-color:#f3b4ae}
.banner.ok{background:var(--grn-s);border-color:#a8dcc0}
.banner .bi{width:54px;height:54px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.banner.red .bi{background:var(--red)}.banner.ok .bi{background:var(--grn)}
.banner h2{margin:2px 0;font-size:22px;letter-spacing:-.01em}
.banner.red h2{color:var(--red)}.banner.ok h2{color:var(--grn)}
.meta{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.meta b{color:var(--ink)}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.hz{padding:14px;display:flex;gap:12px}
.hz .hi{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.hz h4{margin:0;font-size:13px;color:var(--mut);font-weight:600}
.hz .big{font-size:26px;font-weight:700;line-height:1.15;margin:2px 0}
.hz dl{margin:6px 0 0;font-size:12px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.hz dt{color:var(--mut)}.hz dd{margin:0}
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.map{position:relative;background:#0f2a52;overflow:hidden;touch-action:none;border-radius:0 0 14px 14px}
.map svg{width:100%;height:100%;display:block;cursor:grab}
.mctrl{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mctrl button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.legend{position:absolute;left:10px;bottom:10px;background:rgba(9,22,48,.88);color:#e6edf7;border-radius:10px;padding:8px 10px;font-size:11px;max-width:230px;max-height:55%;overflow:auto}
.legend div{display:flex;align-items:center;gap:7px;margin:2px 0}
.legend i{width:14px;height:10px;border-radius:3px;display:inline-block;flex:none}
.pop{position:absolute;right:10px;top:10px;width:270px;max-width:calc(100% - 20px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:12px;font-size:12px;z-index:5}
.pop h5{margin:0 0 6px;font-size:14px}
.pop dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0}
.pop dt{color:var(--mut)}.pop dd{margin:0}
.lmenu{position:absolute;right:10px;top:10px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:12px;max-height:90%;overflow:auto}
.lmenu label{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
.mnote{padding:8px 14px;font-size:11px;color:var(--mut)}
.wcard{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.wcard:last-child{border-bottom:0}
.wcard .wi{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.wcard h5{margin:0;font-size:14px}
.wcard small{color:var(--mut);display:block}
.empty{padding:26px 16px;text-align:center;color:var(--mut)}
.err{padding:16px;color:var(--red);background:var(--red-s);border-radius:10px;margin:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600}
.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block}
.tt{position:absolute;top:6px;transform:translateX(-50%);background:var(--ink);color:var(--card);font-size:12px;padding:6px 8px;border-radius:8px;pointer-events:none;white-space:nowrap;z-index:5}
.cleg{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:4px}
.cleg i{display:inline-block;width:16px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.twocol{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:11.5px;color:var(--mut);font-weight:600;white-space:nowrap}
.tw{overflow-x:auto}
.rbar{display:flex;align-items:center;gap:14px;padding:12px 16px;margin-bottom:14px;flex-wrap:wrap;position:sticky;bottom:8px;z-index:20;box-shadow:0 6px 20px rgba(15,31,58,.18)}
.rbar .ctl{display:flex;gap:6px;align-items:center}
.tl{position:relative;flex:1;min-width:280px;height:54px}
.tl-track{position:absolute;left:14px;right:14px;top:14px;height:4px;background:var(--line);border-radius:4px}
.tl-fill{height:100%;background:var(--blue);border-radius:4px}
.tick{position:absolute;top:6px;transform:translateX(-50%);background:none;border:0;padding:0;text-align:center}
.tick i{display:block;width:16px;height:16px;border-radius:50%;background:var(--card);border:3px solid var(--line);margin:0 auto}
.tick.on i{border-color:var(--blue)}.tick.cur i{background:var(--blue);box-shadow:0 0 0 4px var(--blue-s)}
.tick span{font-size:11px;color:var(--mut);display:block;margin-top:3px}
.tick.cur span{color:var(--ink);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:5px 10px;font-size:12px;font-weight:600}
.seg button.on{background:var(--blue);color:#fff}
.pipe{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.pn{flex:1 1 150px;min-width:140px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:12px;position:relative}
.pn b{display:block;font-size:12.5px;margin-bottom:2px}
.pn.on{border-color:var(--blue);background:var(--blue-s)}
.pn.cur{border-color:var(--org);background:var(--org-s)}
.frm{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.frm label{font-size:11px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
.frm select,.frm input,.num{padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.num{width:90px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi>div{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.kpi b{font-size:22px;display:block}
.kpi small{color:var(--mut)}
.tlv{list-style:none;margin:0;padding:0}
.tlv li{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.tlv .n{width:14px;height:14px;border-radius:50%;border:3px solid var(--line);margin-top:3px;flex:none}
.tlv li.done .n{border-color:var(--blue)}.tlv li.cur .n{background:var(--blue);border-color:var(--blue)}
.tlv li.fut{opacity:.5}
.foot{margin-top:18px;font-size:11.5px;color:var(--mut);display:flex;gap:8px 16px;flex-wrap:wrap;justify-content:space-between}
.cv{width:100%;height:auto;display:block;border-radius:10px;background:#0b1424;image-rendering:auto}
.cvw{position:relative}
.cvw .wm{position:absolute;left:8px;bottom:8px;background:rgba(255,241,222,.92);color:#a85a00;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--blue);animation:sp 1s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{height:14px;border-radius:6px;background:var(--line);margin:8px 0}
.modal{position:fixed;inset:0;background:rgba(6,14,30,.55);display:grid;place-items:center;z-index:100;padding:16px}
.mbox{background:var(--card);border-radius:16px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.mbox h3{margin:0 0 10px}
.mbox textarea{width:100%;height:280px;font:12px ui-monospace,Menlo,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.menu-btn{display:none}
.pulse{animation:pl 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(1.8)}}
@media (prefers-reduced-motion:reduce){.pulse,.spin{animation:none}}
.pm .side,.pm .hide-pm,.pm .search,.pm .prof{display:none!important}
.pm .app{grid-template-columns:1fr}
.pm .main{max-width:1700px;margin:0 auto}
.pm{font-size:16px}
.pm .home-grid{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.pm .hz .big{font-size:32px}
.pm .banner h2{font-size:28px}
.rep-only{display:block}
@media (max-width:1150px){.home-grid,.twocol{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;left:0;top:0;z-index:60;width:260px;transform:translateX(-100%);transition:transform .2s}
 .side.open{transform:none}
 .menu-btn{display:grid}
 .main{padding:0 12px 24px}
 .search input{width:180px}
}
@media (max-width:560px){.g4{grid-template-columns:1fr}.top h1{font-size:20px}.prof span{display:none}}
@media print{
 .side,.top,.rbar,.hide-print,.btn{display:none!important}
 body{background:#fff;color:#000}
 .app{display:block}
 .card{box-shadow:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal" hidden></div>
<script>
'use strict';
/* ================= utils ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const hm=min=>pad(Math.floor(min/60)%24)+':'+pad(((min%60)+60)%60);
const hsh=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return h;};
const rnd=x=>{const y=Math.sin(x*12.9898+78.233)*43758.5453;return y-Math.floor(y);};

/* ================= icons ================= */
const IC={
home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',
map:'<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',
bell:'<path d="M6 9a6 6 0 1112 0c0 6 2 7 2 8H4c0-1 2-2 2-8z"/><path d="M10 21h4"/>',
activity:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',
sensor:'<circle cx="12" cy="12" r="2"/><path d="M7 7a7 7 0 000 10M17 7a7 7 0 010 10M4 4a11 11 0 000 16M20 4a11 11 0 010 16"/>',
sat:'<path d="M4 12a8 8 0 018-8"/><path d="M8 12a4 4 0 014-4"/><circle cx="12" cy="12" r="1.5"/><path d="M13 13l7 7"/>',
chart:'<path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 16v-5M12 16V8M16 16v-8"/>',
gov:'<path d="M3 21h18M5 21V9l7-5 7 5v12"/><path d="M9 21v-6h6v6"/>',
file:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
replay:'<path d="M3 12a9 9 0 109-9"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',
wave:'<path d="M2 15c3 0 3-3 6-3s3 3 6 3 3-3 6-3M2 20c3 0 3-3 6-3s3 3 6 3 3-3 6-3"/><path d="M5 9c2-4 8-6 14-4"/>',
mtn:'<path d="M3 20l6-12 4 7 3-4 5 9z"/>',
layers:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
locate:'<circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>',
plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',
x:'<path d="M6 6l12 12M18 6L6 18"/>',
chev:'<path d="M9 6l6 6-6 6"/>',
play:'<path d="M7 4l13 8-13 8z"/>',pause:'<path d="M7 4v16M17 4v16"/>',
prev:'<path d="M19 5L9 12l10 7zM5 5v14"/>',next:'<path d="M5 5l10 7-10 7zM19 5v14"/>',
reset:'<path d="M3 12a9 9 0 109-9"/><path d="M3 4v5h5"/>',
pres:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 21l4-5 4 5"/>',
menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
book:'<path d="M4 4h7a3 3 0 013 3v13a2 2 0 00-2-2H4zM20 4h-6"/>',
pin:'<path d="M12 21s7-6 7-12a7 7 0 10-14 0c0 6 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>',
shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>'

function lineChart(id,c){
 if(!c.pts||!c.pts.length)return `<div class="empty">Tidak ada data untuk rentang ini.</div>`;
 const W=640,H=c.h||230,L=46,Rr=12,T=14,B=28,pts=c.pts,n=pts.length;
 const vs=pts.map(p=>p.v);let lo=Math.min(...vs,c.base,c.thv),hi=Math.max(...vs,c.base,c.thv);
 const pd=(hi-lo)*.12||1;lo-=pd;hi+=pd;
 const X=i=>L+(W-L-Rr)*(n>1?i/(n-1):.5),Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
 CH[id]={c,W,L,R:Rr,X};
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.name||'Grafik')}">`;
 for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);s+=`<line x1="${L}" x2="${W-Rr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" font-size="10" text-anchor="end" fill="var(--mut)">${v.toFixed(c.dec>1?2:1)}</text>`;}
 for(let i=0;i<=4;i++){const k=Math.round((n-1)*i/4);s+=`<text x="${X(k)}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--mut)">${esc(pts[k].lab)}</text>`;}
 const line=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join('');
 s+=`<path d="${line}L${X(n-1)} ${Y(lo)}L${X(0)} ${Y(lo)}Z" fill="var(--blue)" opacity=".10"/>`;
 s+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(c.base)}" y2="${Y(c.base)}" stroke="#7b879b" stroke-dasharray="5 4"/>`;
 s+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(c.thv)}" y2="${Y(c.thv)}" stroke="var(--red)" stroke-dasharray="6 4"/><text x="${W-Rr-2}" y="${Y(c.thv)-4}" font-size="10" text-anchor="end" fill="var(--red)">${esc(c.thl)}</text>`;
 s+=`<path d="${line}" fill="none" stroke="var(--blue)" stroke-width="2"/>`;
 pts.forEach((p,i)=>{if(c.an(p.v))s+=`<circle cx="${X(i)}" cy="${Y(p.v)}" r="3" fill="var(--red)"><title>Anomali ${esc(p.lab)}: ${p.v.toFixed(c.dec)} ${esc(c.unit)}</title></circle>`;});
 if(c.cur!=null){let bi=0,bd=1e9;pts.forEach((p,i)=>{const d=Math.abs(p.m-c.cur);if(d<bd){bd=d;bi=i;}});s+=`<line x1="${X(bi)}" x2="${X(bi)}" y1="${T}" y2="${H-B}" stroke="var(--blue)" stroke-dasharray="3 3"/><text x="${X(bi)+4}" y="${T+10}" font-size="10" fill="var(--blue)">kini</text>`;}
 s+=`<line class="xh" y1="${T}" y2="${H-B}" stroke="var(--mut)" style="display:none"/></svg><div class="tt" hidden></div>`;
 return `<div class="chart" data-c="${id}">${s}</div>`;
}

function drawInsar(){
 const W=320,H=280,dm=(x,y)=>{const fx=W*.5+Math.sin(y/H*3)*22+(y-H/2)*.25,t=Math.tanh((x-fx)/28),env=Math.exp(-Math.pow((y-H/2)/(H*.42),2));return 24*t*env+(Math.sin(x/37)*Math.cos(y/29))*1.2;};
 const hsv=(h,s,v)=>{const i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);return [[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i%6].map(x=>Math.round(x*255));};
 const div=d=>{const a=Math.max(-1,Math.min(1,d/24));return a<0?[255,Math.round(255*(1+a*.85)),Math.round(255*(1+a))]:[Math.round(255*(1-a)),Math.round(255*(1-a*.6)),255];};
 ['before','after','defo'].forEach(k=>{const c=$('#cv-'+k);if(!c)return;const g=c.getContext('2d'),im=g.createImageData(W,H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){let rgb;const i=(y*W+x)*4;
   if(k==='before'){const ph=(Math.sin(x/53)*Math.cos(y/47)*.3+rnd(x*7+y*13)*.12+.5)%1;rgb=hsv(Math.abs(ph),.55,.85);}
   else if(k==='after'){const ph=((dm(x,y)/2.77)%1+1)%1;rgb=hsv(ph,.85,.95);}
   else rgb=div(dm(x,y));
   im.data[i]=rgb[0];im.data[i+1]=rgb[1];im.data[i+2]=rgb[2];im.data[i+3]=255;}
  g.putImageData(im,0,0);});
}

 ${S_('Peringatan')?`<h3>Peringatan</h3>${tbl(['Waktu (WIB)','Bahaya','Tingkat','Lokasi','Sumber'],WARN.filter(w=>(!r.hz||w.hz===r.hz)).map(w=>[STEPS[w.from].t,w.hz,w.sev,w.loc,w.src+' (RECONSTRUCTED)']))}`:''}
 ${S_('Data sensor')?`<h3>Data sensor (SIMULATED)</h3>${tbl(['Stasiun','Wilayah','Nilai 20:00 WIB','Status'],SENS.filter(s=>(!r.reg||s.kab===r.reg)).map(s=>[s.id,s.kab,s.offline?'—':fmt(s.kind,val(s.kind,178,true,s.o,s.f))+' '+s.unit,sStat(s,178)]))}`:''}
 ${S_('Zona risiko')?`<h3>Zona risiko</h3>${tbl(['Zona','Bahaya','Risiko','Wilayah'],[...LIQ.map(x=>[x.n,'Likuifaksi',x.risk,x.kab]),...LSL.map(x=>[x.id,'Longsor',x.risk,x.kab])].filter(x=>!r.reg||x[3]===r.reg))}<small>Zona demo bersifat skematik; lokasi terdokumentasi berkoordinat perkiraan.</small>`:''}
 ${S_('Timeline respons pemerintah')?`<h3>Timeline respons pemerintah</h3><p>${PHASES.map(p=>p+' ('+GOV.filter(g=>g.phase===p).length+')').join(' → ')}. Seluruh aktivitas belum diverifikasi bukti.</p>`:''}
 ${S_('Catatan evaluasi')?`<h3>Catatan evaluasi</h3><p>Tidak ada skor kinerja. Kekuatan/kelemahan hanya dapat disimpulkan setelah bukti dokumen ditautkan pada register.</p>`:''}
 ${S_('Sumber')?`<h3>Sumber</h3>${tbl(['Sumber','URL','Dataset','Simulasi'],SRC.map(s=>[s[0],esc(s[1]),s[2],s[3]?'Ya':'Tidak']))}`:''}</div>${footer()}`;
}
function pPengaturan(){
 return `<h2 class="pt">Pengaturan</h2>
 <div class="twocol"><div class="card pad"><h4 style="margin:0 0 8px">Tampilan & mode</h4><div class="frm"><label>Mode<span class="seg"><button class="${R()?'on':''}" data-a="mode" data-v="replay">Historical Replay</button><button class="${!R()?'on':''}" data-a="mode" data-v="live">Live Monitoring</button></span></label><label>Tema<span class="seg">${['auto','light','dark'].map(t=>`<button class="${S.theme===t?'on':''}" data-a="theme" data-v="${t}">${t}</button>`).join('')}</span></label></div><p style="font-size:12px;color:var(--mut)">Ambang deteksi diatur di halaman Peringatan Dini.</p></div>
 <div class="card pad"><h4 style="margin:0 0 8px">Status feed live (BMKG)</h4><p>${S.live.state==='loading'?'<span class="spin"></span> Mencoba…':S.live.state==='ok'?chip('TERSAMBUNG','lv-grn'):chip('TIDAK TERSAMBUNG — fallback data demo','lv-org')}</p><p style="font-size:12px;color:var(--mut)">${S.live.state==='error'?'Halaman terpublikasi tidak boleh memanggil situs lain; kegagalan ini normal dan prototipe jatuh ke data demo ('+esc(S.live.msg||'')+'). Di server sendiri, proxy API BMKG lewat backend.':''}</p><button class="btn sm" data-a="retry">Coba lagi</button></div></div>
 <div class="card" style="margin-top:14px"><div class="ch"><h3>Registri sumber data & provenance</h3></div>${tbl(['Sumber','URL','Dataset','retrieved_at','is_simulated'],SRC.map(s=>[s[0],s[1].startsWith('http')?`<a href="${s[1]}" target="_blank" rel="noopener">${s[1]}</a>`:s[1],s[2],'belum diambil (seed lokal)',s[3]?bd('sim'):'false']))}</div>
 <div class="card pad" style="margin-top:14px"><h4 style="margin:0 0 6px">Kebijakan label data</h4><p style="margin:0">${bd('off')} ${bd('doc')} ${bd('rt')} ${bd('sim')} ${bd('rec')}</p><p style="font-size:12px;color:var(--mut)">Setiap visual harus membedakan data terdokumentasi, real-time, simulasi, dan rekonstruksi. Skor kinerja pemerintah, ambang operasional, pengamatan sensor, pengukuran tsunami/deformasi, dan waktu evakuasi tidak dikarang tanpa sumber.</p></div>${footer()}`;
}
const PG={beranda:pBeranda,peta:pPeta,peringatan:pPeringatan,sensor:pSensor,insar:pInsar,analitik:pAnalitik,evaluasi:pEvaluasi,laporan:pLaporan,pengaturan:pPengaturan,replay:pReplay};

/* ================= render ================= */
function render(){
 const app=$('#app'),y=window.scrollY;
 document.documentElement.dataset.theme=S.theme==='auto'?'':S.theme;
 if(S.theme==='auto')delete document.documentElement.dataset.theme;
 app.className=S.pm?'pm':'';
 if(!S.ready){app.innerHTML=`<div style="display:grid;place-items:center;height:80vh;gap:10px;text-align:center"><div><span class="spin"></span><p>Memuat data demo EWS SULTENG…</p></div></div>`;return;}
 let inner;
 try{Object.keys(FE).forEach(k=>delete FE[k]);inner=PG[S.page]();}
 catch(e){inner=`<div class="card"><div class="err"><b>Terjadi kesalahan saat menampilkan halaman.</b><br>${esc(e.message)}<br><button class="btn sm" data-a="nav" data-v="beranda">Kembali ke Beranda</button></div></div>`;console.error(e);}
 app.innerHTML=shell(inner);
 if(S.page==='insar')drawInsar();
 window.scrollTo(0,y);
}
let TMR=null;
function setPlay(){clearInterval(TMR);if(S.playing)TMR=setInterval(()=>{if(S.step<8){S.step++;}else{S.playing=false;clearInterval(TMR);}render();},{1:2500,2:1250,5:500}[S.speed]);}
async function tryLive(){
 S.live={state:'loading'};if(S.ready)render();
 try{const c=new AbortController(),t=setTimeout(()=>c.abort(),5000);const r=await fetch('https://data.bmkg.go.id/DataMKG/TEWS/autogempa.json',{signal:c.signal});clearTimeout(t);if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();S.live={state:'ok',g:j.Infogempa.gempa};}
 catch(e){S.live={state:'error',msg:String(e&&e.message||e)};}
 render();
}
function route(){const p=(location.hash.replace('#/','')||'beranda');S.page=PAGES[p]?p:'beranda';S.nav=false;S.bell=false;render();}
function dl(text,name){return `<p style="font-size:12px;color:var(--mut)">Unduhan file dinonaktifkan di halaman terpublikasi. Salin teks berikut dan simpan sebagai <b>${name}</b>.</p><textarea id="expta" readonly aria-label="Isi ekspor">${esc(text)}</textarea><div style="margin-top:8px"><button class="btn pri" data-a="copy">Salin</button></div>`;}

/* ================= events ================= */
const A={
 nav:v=>{location.hash='#/'+v;},
 navtoggle:()=>{S.nav=!S.nav;render();},
 bell:()=>{S.bell=!S.bell;render();},
 modetoggle:()=>{S.mode=R()?'live':'replay';S.playing=false;setPlay();render();},
 mode:v=>{S.mode=v;S.playing=false;setPlay();S.rangeI=0;render();},
 pm:()=>{S.pm=!S.pm;if(S.pm){S.nav=false;if(S.page!=='beranda')location.hash='#/beranda';}render();},
 step:v=>{S.step=+v;render();},
 prev:()=>{S.step=Math.max(0,S.step-1);render();},
 next:()=>{S.step=Math.min(8,S.step+1);render();},
 reset:()=>{S.step=0;S.playing=false;setPlay();render();},
 play:()=>{if(!S.playing&&S.step>=8)S.step=0;S.playing=!S.playing;setPlay();render();},
 speed:v=>{S.speed=+v;setPlay();render();},
 tab:v=>{S.tab=v;render();},
 range:v=>{S.rangeI=+v;render();},
 lm:()=>{S.lm=!S.lm;render();},
 mz:(v,el)=>{const id=el.dataset.id,m=MV[id];const cx=m.x+m.w/2,cy=m.y+m.w*ASP/2;m.w=Math.max(150,Math.min(1400,v==='in'?m.w*.72:m.w/.72));m.x=cx-m.w/2;m.y=cy-m.w*ASP/2;render();},
 mreset:(v,el)=>{delete MV[el.dataset.id];render();},
 mloc:(v,el)=>{const id=el.dataset.id,[x,y]=P(119.87,-0.9);MV[id]={x:x-150,y:y-165,w:300};render();},
 popclose:()=>{$$('.pop').forEach(p=>p.hidden=true);},
 rtab:v=>{S.riskTab=v;render();},
 fltreset:()=>{S.flt={kab:'',kec:'',risk:''};render();},
 sel:v=>{S.sel=v;render();},
 selkind:v=>{S.sel=v;render();},
 bdetail:()=>{const b=binfo(),st=STEPS[S.step];modal(b.t,`${R()?`<p><b>HISTORICAL EVENT — 28 SEPTEMBER 2018</b> ${bd('rec')} Ini bukan peringatan aktif.</p>`:''}${tbl(['Atribut','Nilai'],b.rows.map(r=>[r[0],esc(r[1])]))}<p><b>Catatan sumber:</b> ${st.note}</p><p><b>Tindakan pengambil keputusan (skenario):</b> ${st.act}</p>`);},
 guide:()=>{modal('Panduan & Edukasi',`<ul><li>Saat gempa kuat: lindungi kepala, berlindung di bawah meja kokoh, jauhi kaca.</li><li>Di pesisir, jika guncangan kuat atau lama, segera menuju tempat tinggi tanpa menunggu sirene.</li><li>Jauhi lereng curam dan tanah lunak/jenuh air setelah gempa (risiko longsor dan likuifaksi).</li><li>Ikuti informasi dari kanal resmi (BMKG, BNPB, BPBD); jangan menyebarkan kabar yang belum terverifikasi.</li></ul><p style="font-size:12px;color:var(--mut)">Panduan umum untuk keperluan edukasi prototipe ini.</p>`);},
 mclose:()=>{$('#modal').hidden=true;},
 threset:()=>{S.th={...TH0};render();},
 theme:v=>{S.theme=v;render();},
 retry:()=>tryLive(),
 pg:v=>{S.an.pg=Math.max(0,S.an.pg+ +v);render();},
 anreset:()=>{S.an={hz:'',reg:'',src:'',st:'',rs:'',date:'2018-09-28',pg:0};render();},
 view:v=>{const r=filtRows(S.an)[+v];if(!r)return;modal('Detail catatan',tbl(['Field','Nilai'],[['timestamp',r.t],['hazard',r.hz],['location',esc(r.loc)],['value',r.v+' '+r.u],['source',esc(r.src)],['source_url',esc(r.url)],['retrieved_at','seed-lokal'],['dataset_name',r.ds],['status',r.st],['dataQuality',r.q],['is_simulated',String(r.sim)]]));},
 export:v=>{const [f,w]=v.split('|'),rows=filtRows(w==='rep'?S.rep:S.an);modal('Export '+f.toUpperCase(),dl(f==='csv'?toCSV(rows):toJSON(rows),'ews-sulteng.'+f));},
 copy:()=>{const t=$('#expta');t.select();try{navigator.clipboard.writeText(t.value).catch(()=>document.execCommand('copy'));}catch(e){document.execCommand('copy');}},
 gen:()=>{S.rep.done=true;render();},
 print:()=>{try{window.print();}catch(e){modal('Print','<p>Cetak tidak tersedia di jendela ini. Gunakan Ctrl/Cmd+P pada browser.</p>');}}
};
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');
 if(el){A[el.dataset.a]&&A[el.dataset.a](el.dataset.v,el);return;}
 const f=e.target.closest('[data-f]');
 if(f){if(window._pm&&Date.now()-window._pm<60)return;const mp=f.closest('.map'),o=FE[f.dataset.f];if(!o)return;const pop=$('.pop',mp);if(!pop)return;
  pop.innerHTML=`<button class="ibtn" style="position:absolute;right:6px;top:6px;width:26px;height:26px" data-a="popclose" aria-label="Tutup">${ic('x',12)}</button><h5>${esc(o.title)}</h5><dl><dt>Lokasi</dt><dd>${esc(o.loc)}</dd><dt>Bahaya</dt><dd>${esc(o.hz)}</dd><dt>Level risiko</dt><dd>${esc(o.risk)}</dd><dt>Nilai terakhir</dt><dd>${esc(o.val)}</dd><dt>Waktu</dt><dd>${esc(o.time)}</dd><dt>Sumber</dt><dd>${esc(o.src)}</dd><dt>Status data</dt><dd>${bd(o.bd)}</dd></dl>${o.sid?`<button class="btn sm" style="margin-top:8px" data-a="sel" data-v="${o.sid}">Lihat detail sensor</button>`:''}`;
  pop.hidden=false;return;}
 if(!e.target.closest('.search'))$('#sres')&&($('#sres').hidden=true);
 if(e.target.id==='modal')A.mclose();
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.layer){S.layers[t.dataset.layer]=t.checked?1:0;render();}
 else if(t.dataset.th){const v=parseFloat(t.value);if(!isNaN(v)){S.th[t.dataset.th]=v;}render();}
 else if(t.dataset.flt){S.flt[t.dataset.flt]=t.value;if(t.dataset.flt==='kab')S.flt.kec='';render();}
 else if(t.dataset.rt){S.riskTab=t.value;render();}
 else if(t.dataset.rx){S.rx[t.dataset.rx]=t.checked?1:0;render();}
 else if(t.dataset.admin){S.admin=t.checked;render();}
 else if(t.dataset.an){S.an[t.dataset.an]=t.value;S.an.pg=0;render();}
 else if(t.dataset.rep){S.rep[t.dataset.rep]=t.value;}
 else if(t.dataset.repsec){S.rep.sec[t.dataset.repsec]=t.checked;}
});
document.addEventListener('input',e=>{
 if(e.target.id!=='q')return;
 const q=e.target.value.trim().toLowerCase(),box=$('#sres');
 if(!q){box.hidden=true;return;}
 const res=[];
 NAV.forEach(([k,l])=>{if(l.toLowerCase().includes(q))res.push([l+' (halaman)',`nav|${k}`]);});
 if('historical replay'.includes(q))res.push(['Historical Replay (halaman)','nav|replay']);
 SENS.forEach(s=>{if(s.id.toLowerCase().includes(q)||s.kab.toLowerCase().includes(q))res.push([s.id+' — '+s.kab,`sel|${s.id}`]);});
 WARN.forEach(w=>{if(w.hz.toLowerCase().includes(q))res.push(['Peringatan '+w.hz,'nav|peringatan']);});
 box.innerHTML=res.length?res.slice(0,7).map(r=>`<button data-a="${r[1].split('|')[0]==='sel'?'searchsel':'nav'}" data-v="${r[1].split('|')[1]}">${esc(r[0])}</button>`).join(''):'<div class="empty">Tidak ditemukan.</div>';
 box.hidden=false;
});
A.searchsel=v=>{S.sel=v;location.hash='#/sensor';render();};
/* pan & tooltip */
let pan=null,lastCh=null;
document.addEventListener('pointerdown',e=>{const mp=e.target.closest('.map');if(!mp||e.target.closest('.mctrl,.pop,.lmenu,.legend'))return;const v=MV[mp.id];if(!v)return;pan={id:mp.id,x:e.clientX,y:e.clientY,vx:v.x,vy:v.y,moved:false};});
document.addEventListener('pointermove',e=>{
 if(pan){const mp=document.getElementById(pan.id);if(mp){const v=MV[pan.id],svg=$('svg',mp),r=svg.getBoundingClientRect(),sc=Math.min(r.width/v.w,r.height/(v.w*ASP)),dx=e.clientX-pan.x,dy=e.clientY-pan.y;if(Math.abs(dx)+Math.abs(dy)>4)pan.moved=true;if(pan.moved){v.x=pan.vx-dx/sc;v.y=pan.vy-dy/sc;svg.setAttribute('viewBox',`${v.x} ${v.y} ${v.w} ${v.w*ASP}`);}}}
 const ch=e.target.closest&&e.target.closest('.chart');
 if(lastCh&&lastCh!==ch){$('.tt',lastCh)&&($('.tt',lastCh).hidden=true);const x=$('.xh',lastCh);x&&(x.style.display='none');lastCh=null;}
 if(!ch)return;const d=CH[ch.dataset.c];if(!d)return;
 const svg=$('svg',ch),r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*d.W,n=d.c.pts.length;
 let i=Math.round((x-d.L)/(d.W-d.L-d.R)*(n-1));i=Math.max(0,Math.min(n-1,i));const p=d.c.pts[i];
 const xh=$('.xh',ch);xh.setAttribute('x1',d.X(i));xh.setAttribute('x2',d.X(i));xh.style.display='';
 const tt=$('.tt',ch);tt.hidden=false;tt.style.left=Math.min(80,Math.max(6,d.X(i)/d.W*100))+'%';
 tt.innerHTML=`<b>${esc(p.lab)}</b> · ${p.v.toFixed(d.c.dec)} ${esc(d.c.unit)}${d.c.an(p.v)?' · <span style="color:#ff8b7f">anomali</span>':''}`;lastCh=ch;
});
document.addEventListener('pointerup',()=>{if(pan&&pan.moved)window._pm=Date.now();pan=null;});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(!$('#modal').hidden)A.mclose();else if(S.pm){S.pm=false;render();}return;}
 if(/INPUT|SELECT|TEXTAREA/.test((e.target.tagName||'')))return;
 if((S.page==='beranda'||S.page==='replay'||S.page==='peringatan'||S.page==='sensor')&&R()){if(e.key==='ArrowRight')A.next();if(e.key==='ArrowLeft')A.prev();}
});
window.addEventListener('hashchange',route);
render();
setTimeout(()=>{S.ready=true;route();tryLive();},650);
</script>
</body>
</html>
